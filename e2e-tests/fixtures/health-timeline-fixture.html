<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>health-timeline fixture</title>
</head>
<body>
  <div data-visit-id="1" data-ai-status="PENDING" data-visit-date="2025-01-10">
    <span class="ai-spinner"></span>
    <span>Generating summary…</span>
  </div>
  <div data-visit-id="2" data-ai-status="PENDING" data-visit-date="2025-02-15">
    <span class="ai-spinner"></span>
    <span>Generating summary…</span>
  </div>
  <div data-visit-id="3" data-ai-status="DONE" data-visit-date="2025-03-01">
    <span class="visit-date">2025-03-01</span>
    <span class="urgency-routine">routine</span>
    <span class="health-tag">vaccination</span>
    <p class="ai-summary">Annual checkup OK.</p>
  </div>
  <div data-visit-id="4" data-ai-status="FAILED" data-visit-date="2025-04-01">
    <div class="ai-error">Unable to generate summary.</div>
  </div>
  <script>
(function () {
  'use strict';
  var MSG_UNABLE = 'Unable to generate summary.';
  var MAX_POLLS = 40;
  var INTERVAL_MS = 3000;
  var activeTimers = new Map();

  function buildDoneHtml(date, data) {
    var wrap = document.createElement('div');
    var visitDateSpan = document.createElement('span');
    visitDateSpan.className = 'visit-date';
    visitDateSpan.textContent = date;
    wrap.appendChild(visitDateSpan);
    if (data.urgency) {
      var urgencySpan = document.createElement('span');
      urgencySpan.className = 'urgency-' + data.urgency;
      urgencySpan.textContent = data.urgency;
      wrap.appendChild(urgencySpan);
    }
    if (data.tags && data.tags.length) {
      for (var i = 0; i < data.tags.length; i++) {
        var tagSpan = document.createElement('span');
        tagSpan.className = 'health-tag';
        tagSpan.textContent = data.tags[i];
        wrap.appendChild(tagSpan);
      }
    }
    if (data.summary) {
      var summaryP = document.createElement('p');
      summaryP.className = 'ai-summary';
      summaryP.textContent = data.summary;
      wrap.appendChild(summaryP);
    }
    if (data.followUp) {
      var followP = document.createElement('p');
      followP.className = 'ai-follow-up';
      followP.textContent = data.followUp;
      wrap.appendChild(followP);
    }
    return wrap.innerHTML;
  }

  function buildErrorHtml() {
    var err = document.createElement('div');
    err.className = 'ai-error';
    err.textContent = MSG_UNABLE;
    return err.outerHTML;
  }

  function onVisibilityChange() {
    if (document.visibilityState === 'hidden') {
      activeTimers.forEach(function (state) {
        if (state.timerId != null) {
          clearInterval(state.timerId);
          state.timerId = null;
        }
      });
    } else {
      activeTimers.forEach(function (state, entry) {
        if (state.timerId == null) {
          state.timerId = setInterval(function () {
            pollEntry(entry);
          }, INTERVAL_MS);
        }
      });
    }
  }

  function stopEntry(entry) {
    var state = activeTimers.get(entry);
    if (!state) {
      return;
    }
    if (state.timerId != null) {
      clearInterval(state.timerId);
    }
    activeTimers.delete(entry);
    if (activeTimers.size === 0) {
      document.removeEventListener('visibilitychange', onVisibilityChange);
    }
  }

  function pollEntry(entry) {
    var state = activeTimers.get(entry);
    if (!state) {
      return;
    }
    var visitId = entry.dataset.visitId;
    var visitDate = entry.dataset.visitDate;
    fetch('/visits/' + visitId + '/summary')
      .then(function (r) {
        return r.json();
      })
      .then(function (data) {
        state.pollCount += 1;
        if (data.status === 'DONE') {
          entry.innerHTML = buildDoneHtml(visitDate, data);
          entry.dataset.aiStatus = 'DONE';
          stopEntry(entry);
        } else if (data.status === 'FAILED' || state.pollCount >= MAX_POLLS) {
          entry.innerHTML = buildErrorHtml();
          entry.dataset.aiStatus = 'FAILED';
          stopEntry(entry);
        }
      })
      .catch(function () {});
  }

  function startEntry(entry) {
    var state = { timerId: null, pollCount: 0 };
    state.timerId = setInterval(function () {
      pollEntry(entry);
    }, INTERVAL_MS);
    activeTimers.set(entry, state);
  }

  function boot() {
    var pendingEntries = document.querySelectorAll('[data-ai-status="PENDING"]');
    if (pendingEntries.length === 0) {
      return;
    }
    pendingEntries.forEach(function (entry) {
      startEntry(entry);
    });
    document.addEventListener('visibilitychange', onVisibilityChange);
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
  </script>
</body>
</html>
