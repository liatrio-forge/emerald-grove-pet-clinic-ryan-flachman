name: Bootstrap Dev State Backend

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type bootstrap dev state to confirm the one-time dev backend bootstrap.
        required: true

permissions:
  contents: read

concurrency:
  group: bootstrap-dev-state
  cancel-in-progress: false

jobs:
  bootstrap-dev-state:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: dev-bootstrap
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STATE_BUCKET_NAME: emerald-grove-pet-clinic-dev-terraform-state
      LOCK_TABLE_NAME: emerald-grove-pet-clinic-dev-terraform-locks
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "State bootstrap requires the main branch." >&2
          exit 1

      - name: Require typed confirmation
        if: github.event.inputs.confirmation != 'bootstrap dev state'
        run: |
          echo "State bootstrap requires confirmation: bootstrap dev state" >&2
          exit 1

      - name: Require bootstrap configuration
        run: |
          if [[ -z "${{ vars.AWS_REGION }}" ]]; then
            echo "AWS region is required." >&2
            exit 1
          fi
          if [[ -z "${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}" ]]; then
            echo "BOOTSTRAP_AWS_ACCESS_KEY_ID is required." >&2
            exit 1
          fi
          if [[ -z "${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}" ]]; then
            echo "BOOTSTRAP_AWS_SECRET_ACCESS_KEY is required." >&2
            exit 1
          fi

      - name: Configure AWS credentials from bootstrap secrets
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          aws-access-key-id: ${{ secrets.BOOTSTRAP_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.BOOTSTRAP_AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.BOOTSTRAP_AWS_SESSION_TOKEN }}

      - name: Create or reconcile backend bucket
        run: |
          if ! aws s3api head-bucket --bucket "$STATE_BUCKET_NAME" 2>/dev/null; then
            if [[ "$AWS_REGION" == "us-east-1" ]]; then
              aws s3api create-bucket --bucket "$STATE_BUCKET_NAME"
            else
              aws s3api create-bucket --bucket "$STATE_BUCKET_NAME" --create-bucket-configuration LocationConstraint="$AWS_REGION"
            fi
          fi
          aws s3api put-bucket-versioning --bucket "$STATE_BUCKET_NAME" --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption --bucket "$STATE_BUCKET_NAME" --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          aws s3api put-public-access-block --bucket "$STATE_BUCKET_NAME" --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - name: Create or reconcile backend lock table
        run: |
          if ! aws dynamodb describe-table --table-name "$LOCK_TABLE_NAME" >/dev/null 2>&1; then
            aws dynamodb create-table --table-name "$LOCK_TABLE_NAME" --attribute-definitions AttributeName=LockID,AttributeType=S --key-schema AttributeName=LockID,KeyType=HASH --billing-mode PAY_PER_REQUEST
            aws dynamodb wait table-exists --table-name "$LOCK_TABLE_NAME"
          fi

      - name: Summarize backend outputs
        run: |
          {
            echo "## Backend outputs"
            echo ""
            echo "Promote these backend values into GitHub Actions configuration before using the tracked bootstrap workflow."
            echo ""
            echo "| Variable | Value | Scope |"
            echo "| --- | --- | --- |"
            echo "| AWS_REGION | ${AWS_REGION} | repository |"
            echo "| TF_STATE_BUCKET | ${STATE_BUCKET_NAME} | environment: dev |"
            echo "| TF_LOCK_TABLE | ${LOCK_TABLE_NAME} | environment: dev |"
            echo ""
            echo "Next steps:"
            echo "1. Promote these values into GitHub configuration."
            echo "2. Run Bootstrap Dev Infrastructure after promoting these backend values."
          } >> "$GITHUB_STEP_SUMMARY"
