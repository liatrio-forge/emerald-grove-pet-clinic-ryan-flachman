<!DOCTYPE html>

<html xmlns:th="https://www.thymeleaf.org" th:replace="~{fragments/layout :: layout (~{::body},'owners')}">

<body>

  <h2 th:text="#{ownerInformation}">Owner Information</h2>

  <div th:if="${message}" class="alert alert-success" id="success-message">
    <span th:text="${message}"></span>
  </div>

  <div th:if="${error}" class="alert alert-danger" id="error-message">
    <span th:text="${error}"></span>
  </div>

  <table class="table table-striped liatrio-table" th:object="${owner}">
    <tr>
      <th th:text="#{name}">Name</th>
      <td><b th:text="*{firstName + ' ' + lastName}"></b></td>
    </tr>
    <tr>
      <th th:text="#{address}">Address</th>
      <td th:text="*{address}"></td>
    </tr>
    <tr>
      <th th:text="#{city}">City</th>
      <td th:text="*{city}"></td>
    </tr>
    <tr>
      <th th:text="#{telephone}">Telephone</th>
      <td th:text="*{telephone}"></td>
    </tr>
  </table>

  <a th:href="@{__${owner.id}__/edit}" class="btn btn-primary" th:text="#{editOwner}">Edit
    Owner</a>
  <a th:href="@{__${owner.id}__/pets/new}" class="btn btn-primary" th:text="#{addNewPet}">Add
    New Pet</a>

  <br />
  <br />
  <br />
  <h2 th:text="#{petsAndVisits}">Pets and Visits</h2>

  <table class="table table-striped liatrio-table">

    <tr th:each="pet : ${owner.pets}">
      <td valign="top">
        <dl class="dl-horizontal">
          <dt th:text="#{name}">Name</dt>
          <dd th:text="${pet.name}"></dd>
          <dt th:text="#{birthDate}">Birth Date</dt>
          <dd th:text="${#temporals.format(pet.birthDate, 'yyyy-MM-dd')}"></dd>
          <dt th:text="#{type}">Type</dt>
          <dd th:text="${pet.type}"></dd>
        </dl>
      </td>
      <td valign="top">
        <table class="table-condensed liatrio-table">
          <thead>
            <tr>
              <th th:text="#{visitDate}">Visit Date</th>
              <th th:text="#{description}">Description</th>
            </tr>
          </thead>
          <tr th:each="visit : ${pet.visits}">
            <td th:text="${#temporals.format(visit.date, 'yyyy-MM-dd')}"></td>
            <td th:text="${visit?.description}"></td>
          </tr>
          <tr>
            <td><a th:href="@{__${owner.id}__/pets/__${pet.id}__/edit}" th:text="#{editPet}">Edit Pet</a></td>
            <td><a th:href="@{__${owner.id}__/pets/__${pet.id}__/visits/new}" th:text="#{addVisit}">Add Visit</a></td>
            <td>
              <a href="#"
                 class="delete-pet-trigger"
                 th:data-pet-id="${pet.id}"
                 th:data-owner-id="${owner.id}"
                 th:data-pet-name="${pet.name}"
                 th:data-visit-count="${pet.visits.size()}"
                 th:text="#{deletePet}">Delete</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

  </table>

  <!-- Delete Pet Modal -->
  <div id="deletePetModal" style="display:none; position:fixed; top:0; left:0;
       width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000;">
    <div style="background:#fff; margin:15% auto; padding:2rem; max-width:420px;
         border-radius:4px;">
      <h4><span th:text="#{deletePet}">Delete</span> <span id="modalPetName"></span>?</h4>
      <p id="modalVisitWarning" style="display:none; color:#dc3545;"></p>
      <p th:text="#{delete.cannotUndo}">This cannot be undone.</p>
      <form id="deleteForm" method="post" action="">
        <button type="button"
                onclick="document.getElementById('deletePetModal').style.display='none'">
          Cancel
        </button>
        <button type="submit" id="confirmDeleteBtn" th:text="#{deletePet}">Delete</button>
      </form>
    </div>
  </div>

  <script>
    document.querySelectorAll('.delete-pet-trigger').forEach(function(trigger) {
      trigger.addEventListener('click', function(e) {
        e.preventDefault();
        var petName    = this.dataset.petName;
        var visitCount = parseInt(this.dataset.visitCount, 10);
        var ownerId    = this.dataset.ownerId;
        var petId      = this.dataset.petId;

        document.getElementById('modalPetName').textContent = petName;

        var warningEl  = document.getElementById('modalVisitWarning');
        var confirmBtn = document.getElementById('confirmDeleteBtn');
        if (visitCount > 0) {
          warningEl.textContent =
            'This will also permanently delete ' + visitCount + ' visit record(s).';
          warningEl.style.display = 'block';
          confirmBtn.textContent  = 'Delete anyway';
        } else {
          warningEl.style.display = 'none';
          confirmBtn.textContent  = 'Delete';
        }

        document.getElementById('deleteForm').action =
          '/owners/' + ownerId + '/pets/' + petId + '/delete';

        document.getElementById('deletePetModal').style.display = 'block';
      });
    });
  </script>

  <script>
    // Function to hide the success and error messages after 3 seconds
    function hideMessages() {
      setTimeout(function () {
        var successMsg = document.getElementById("success-message");
        var errorMsg = document.getElementById("error-message");
        if (successMsg) {
          successMsg.style.display = "none";
        }
        if (errorMsg) {
          errorMsg.style.display = "none";
        }
      }, 3000); // 3000 milliseconds (3 seconds)
    }

    // Call the function to hide messages
    hideMessages();
  </script>

</body>


</html>
